name: Refresh class data

# Run on demand: Actions → "Refresh class data" → Run workflow (also works in the GitHub mobile app).
on:
  workflow_dispatch:
    inputs:
      days:
        description: "How many days ahead"
        default: "7"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Studio lists change rarely; keep the crawl cache between runs (entries expire inside the crawler).
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-

      - name: Build class data
        env:
          WELLPASS_REFRESH_TOKEN: ${{ secrets.WELLPASS_REFRESH_TOKEN }}
          PYTHONUTF8: "1"
        run: uv run --no-project --python 3.12 python -m urbanpass --days "${{ inputs.days || 7 }}"

      - name: Commit if changed
        run: |
          git config user.name "urban-pass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress/urban-pass/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh class data $(date -u +%Y-%m-%d)"
            git push
          fi

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy explicitly.
  deploy:
    needs: refresh
    uses: ./.github/workflows/deploy-pages.yml
