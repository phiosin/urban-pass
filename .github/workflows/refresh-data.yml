name: Refresh class data

on:
  schedule:
    - cron: "30 4 * * *"   # every day, 05:30 / 06:30 Berlin time
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      # Studio lists change rarely; keep the crawl cache between runs (entries expire inside the crawler).
      - uses: actions/cache@v4
        with:
          path: data/raw
          key: crawl-${{ github.run_id }}
          restore-keys: crawl-

      - name: Build 7 days of data
        env:
          WELLPASS_REFRESH_TOKEN: ${{ secrets.WELLPASS_REFRESH_TOKEN }}
          PYTHONUTF8: "1"
        run: uv run --no-project --python 3.12 python -m urbanpass --days 7

      - name: Commit if changed
        run: |
          git config user.name "urban-pass-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wordpress/urban-pass/data
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Refresh class data $(date -u +%Y-%m-%d)"
            git push
          fi

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so publish explicitly.
  publish:
    needs: refresh
    uses: ./.github/workflows/publish-plugin.yml
